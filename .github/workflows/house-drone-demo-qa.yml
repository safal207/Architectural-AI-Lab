name: House + Drone Demo QA

on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/house-drone-demo-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Test clock, graph, actual GLB geometry and accessory lifecycle
        run: node --test qa/demo-timeline.mjs qa/demo-scene.mjs
      - name: Build the unmodified production configuration
        run: npm run build
      - name: Install the browser test runner
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test desktop and reduced-motion mobile controls
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-demo-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node qa/demo-browser.mjs
      - name: Audit native demo cadence (diagnostic, not release acceptance)
        env:
          VILLA_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          VILLA_ARTIFACT_RUN: ${{ github.run_id }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-demo-motion.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node qa/demo-motion-audit.mjs
      - name: Upload exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-drone-demo-qa
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-output
          if-no-files-found: warn
          retention-days: 7
