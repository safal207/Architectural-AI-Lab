name: Arrival Native Raster QA

on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/arrival-native-raster-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arrival:
    name: Native DPR 1 / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop, mobile, reduced]
    defaults:
      run:
        shell: bash
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    env:
      VILLA_URL: http://127.0.0.1:4173/
      QA_OUTPUT: qa-native-arrival-output
      QA_SCENARIO: ${{ matrix.scenario }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Controller and geometry controls
        run: |
          node qa/arrival-director.mjs
          node qa/arrival-geometry.mjs
      - name: Build unchanged production viewer
        run: npm run build
      - name: Prepare isolated native-resolution test copy
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const spec = {
            desktop: ['desktop', 1440, 'no-preference'],
            mobile: ['mobile', 390, 'no-preference'],
            reduced: ['reduced', 320, 'reduce']
          }[process.env.QA_SCENARIO];
          assert(spec, 'Unknown native scenario');
          const source = readFileSync('qa/arrival-browser.mjs', 'utf8');
          let code = source;
          const replaceOnce = (from, to) => {
            assert.equal(code.split(from).length, 2, `Expected exactly one test seam: ${from}`);
            code = code.replace(from, to);
          };
          replaceOnce('const motionPixelRatio = 0.5;', 'const motionPixelRatio = 1;');
          replaceOnce('Functional camera/control QA at DPR 0.5; not full-resolution visual quality or device performance.',
            'Native DPR 1 functional camera/control QA; not physical-device performance or aesthetic certification.');
          replaceOnce("[['desktop', 1440, 'no-preference'], ['mobile', 390, 'no-preference'], ['reduced', 320, 'reduce']]",
            JSON.stringify([spec]));
          // The native mobile case must complete the entire movement, not skip it.
          replaceOnce("if (name === 'desktop') {\n          await page.waitForFunction",
            "if (reducedMotion !== 'reduce') {\n          await page.waitForFunction");
          // Fail promptly if there was no intermediate frame; never accept just the final pose.
          replaceOnce("await page.waitForFunction(() => window.__arrivalProbe.pauseRequested\n          && document.querySelector('.arrival-reveal')?.dataset.phase === 'paused',",
            "await page.waitForFunction(() => (window.__arrivalProbe.pauseRequested\n          && document.querySelector('.arrival-reveal')?.dataset.phase === 'paused')\n          || document.querySelector('.arrival-reveal')?.dataset.phase === 'complete',");
          replaceOnce('assert(pauseFrame.progress > 0',
            "assert(pauseFrame, 'Native-resolution route completed without an intermediate rendered pause point');\n        assert(pauseFrame.progress > 0");
          replaceOnce('      await observeArrival(page);', `      scenario.renderer = await canvas.evaluate(element => {
            const surface = element.querySelector('canvas');
            const gl = surface.getContext('webgl2') || surface.getContext('webgl');
            const debug = gl?.getExtension('WEBGL_debug_renderer_info');
            return { cssHeight: element.clientHeight, pixelHeight: surface.height,
              qaCapture: surface.dataset.qaCapture,
              renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null,
              vendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
              context: gl?.getContextAttributes() };
          });
          assert.equal(scenario.renderer.pixelHeight, scenario.renderer.cssHeight);
          report.browserVersion = browser.version();
          await observeArrival(page);`);
          mkdirSync(process.env.QA_OUTPUT, { recursive: true });
          writeFileSync('qa/arrival-native.generated.mjs', code);
          writeFileSync(`${process.env.QA_OUTPUT}/arrival-native.generated.mjs`, code);
          writeFileSync(`${process.env.QA_OUTPUT}/provenance.json`, JSON.stringify({
            prHeadSha: process.env.PR_HEAD_SHA,
            checkoutSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            scenario: spec, dpr: 1,
            sourceTestSha256: createHash('sha256').update(source).digest('hex'),
            nativeTestSha256: createHash('sha256').update(code).digest('hex'),
            glbSha256: createHash('sha256').update(readFileSync('dist/villa.glb')).digest('hex'),
            boundary: 'Only a separate test copy is transformed. Production code, GLB, camera, timer and existing DPR 0.5 gate are unchanged. Pause/cancel use existing DOM handlers; Play/Resume use Playwright actions.'
          }, null, 2));
          NODE
          node --check qa/arrival-native.generated.mjs
          git diff --exit-code -- src public qa/arrival-browser.mjs package.json package-lock.json
      - name: Install pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/native-arrival-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "$VILLA_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/native-arrival-preview.log
          exit 1
      - name: Entire native-resolution route and controls
        run: node qa/arrival-native.generated.mjs
      - name: Summarize observed frame intervals
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const path = `${process.env.QA_OUTPUT}/report.json`;
          if (!existsSync(path)) { console.log('No browser report was produced; inspect the failed setup step.'); process.exit(0); }
          const report = JSON.parse(readFileSync(path, 'utf8'));
          const summaries = report.scenarios.map(scenario => {
            const probe = scenario.observations;
            const frames = (probe?.frames ?? []).filter(f => !probe?.cancelFrame || f.at < probe.cancelFrame.at);
            const start = frames.findIndex(f => ['threshold', 'moving', 'still'].includes(f.phase));
            const sequence = start < 0 ? [] : frames.slice(start);
            const intervals = [];
            for (let i = 1; i < sequence.length; i++) {
              const a = sequence[i - 1], b = sequence[i];
              if (['threshold', 'moving'].includes(a.phase) && ['moving', 'complete', 'idle'].includes(b.phase)
                && a.uiPhase !== 'paused' && b.uiPhase !== 'paused') intervals.push(b.at - a.at);
            }
            const sorted = [...intervals].sort((a, b) => a - b);
            return { name: scenario.name, status: scenario.status, raster: scenario.raster,
              renderer: scenario.renderer, failure: scenario.failure ?? null,
              movingObservations: sequence.filter(f => f.phase === 'moving' && f.progress > 0 && f.progress < 1).length,
              measuredIntervals: intervals.length,
              medianIntervalMs: sorted.length ? sorted[Math.floor(sorted.length / 2)] : null,
              maxIntervalMs: sorted.length ? sorted.at(-1) : null,
              intervalsOver250ms: intervals.filter(value => value > 250).length,
              lifecycle: probe?.lifecycle ?? [],
              boundary: 'Post-render diagnostic observations, not GPU/physical-display timing. Paused intervals excluded. No automatic smoothness approval.' };
          });
          writeFileSync(`${process.env.QA_OUTPUT}/native-summary.json`, JSON.stringify(summaries, null, 2));
          console.log(JSON.stringify(summaries, null, 2));
          NODE
      - name: Upload native-resolution evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arrival-native-dpr1-${{ matrix.scenario }}
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-native-arrival-output
          if-no-files-found: warn
          retention-days: 14
