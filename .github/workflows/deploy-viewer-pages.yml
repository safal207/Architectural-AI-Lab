name: Deploy Villa Viewer

on:
  push:
    branches: [main]
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/deploy-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate native Blender GLB
        run: |
          test -s public/villa.glb
          python - <<'PY'
          from pathlib import Path
          import struct
          raw = Path('public/villa.glb').read_bytes()
          magic, version, length = struct.unpack_from('<4sII', raw, 0)
          assert magic == b'glTF', magic
          assert version == 2, version
          assert length == len(raw), (length, len(raw))
          print(f'villa.glb OK: {len(raw)} bytes, GLB v{version}')
          PY
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
