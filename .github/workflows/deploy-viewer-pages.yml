name: Deploy Villa Viewer

on:
  push:
    branches: [main]
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/deploy-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate canonical glTF
        run: |
          test -s public/villa.gltf
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('public/villa.gltf','utf8')); if(g.asset?.version!=='2.0') process.exit(1); console.log('villa.gltf JSON OK')"
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
