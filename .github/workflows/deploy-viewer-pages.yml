name: Deploy Villa Viewer

on:
  push:
    branches: [main]
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - 'projects/Dubai-Luxury-Villa-AI/tools/validate_viewer_asset.py'
      - 'projects/Dubai-Luxury-Villa-AI/tools/requirements-validation.txt'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.3-viewer-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-viewer-promotion.json'
      - '.github/workflows/deploy-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install image validation dependency
        run: python -m pip install -r ../../tools/requirements-validation.txt

      - name: Validate current gated viewer asset and render evidence
        run: python ../../tools/validate_viewer_asset.py

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
