name: Living Pool Showcase QA

on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/Dashboard.jsx'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/MaterialSwitcher.jsx'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/ProjectBrief.jsx'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/materialPalettes.js'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/LivingPoolShowcase.*'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/VillaViewer.jsx'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa/living-pool-showcase.mjs'
      - '.github/workflows/living-pool-showcase-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/showcase-qa" --no-save --package-lock=false playwright@1.55.0
          ln -s "$RUNNER_TEMP/showcase-qa/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/showcase-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-showcase-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/villa-showcase-preview.log
          exit 1
      - name: Check two views, palette continuity, actual briefs and fallback
        env:
          VILLA_URL: http://127.0.0.1:4173/
          QA_OUTPUT: qa-living-pool-output
          VILLA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export VILLA_CHECKOUT_SHA="$(git rev-parse HEAD)"
          node qa/living-pool-showcase.mjs
      - name: Upload static evidence and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: villa-living-pool-showcase
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-living-pool-output
          if-no-files-found: warn
          retention-days: 14
