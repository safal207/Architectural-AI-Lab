name: Arrival Reveal QA
on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/arrival-reveal-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arrival:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    env:
      VILLA_URL: http://127.0.0.1:4173/
      QA_OUTPUT: qa-arrival-output
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Clock and geometry negative controls
        run: |
          node qa/arrival-director.mjs
          node qa/arrival-geometry.mjs
      - run: npm run build
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/arrival-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "$VILLA_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/arrival-preview.log
          exit 1
      - name: Actual model, desktop, mobile and reduced motion
        run: node qa/arrival-browser.mjs
      - name: Upload exact-head screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: villa-arrival-reveal
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-arrival-output
          if-no-files-found: warn
          retention-days: 14
