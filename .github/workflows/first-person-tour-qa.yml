name: First Person Tour QA

on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - '.github/workflows/first-person-tour-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkthrough-qa:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Validate navigation graph and stair interpolation
        run: node qa/walkthrough-graph.mjs

      - name: Validate walkthrough input lifecycle
        run: node qa/walkthrough-input.mjs

      - name: Build viewer
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/villa-preview.log
          exit 1

      - name: Run first-person desktop and touch smoke QA
        env:
          VILLA_URL: http://127.0.0.1:4173/
          QA_OUTPUT: qa-first-person-output
        run: node qa/first-person-ui.mjs

      - name: Check room selection, tour exit and narrow mobile layout
        env:
          VILLA_URL: http://127.0.0.1:4173/
          QA_OUTPUT: qa-first-person-output/full-viewer
        run: node qa/live-browser.mjs

      - name: Upload walkthrough QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-first-person-qa
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-first-person-output
          if-no-files-found: warn
          retention-days: 14
