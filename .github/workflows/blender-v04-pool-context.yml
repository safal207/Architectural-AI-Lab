name: Blender v0.4 Pool Context Gate

on:
  push:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v04_pool_context.py'
      - 'projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v04_pool_context_v4.py'
      - '.github/workflows/blender-v04-pool-context.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubai-villa-v04-pool-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and software rendering stack
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          blender --version | head -n 1

      - name: Fetch CC0 Poly Haven maps used by frozen material baseline
        run: |
          set -euxo pipefail
          A='projects/Dubai-Luxury-Villa-AI/assets/third-party/polyhaven'
          mkdir -p "$A"
          d(){ curl -L --fail --retry 3 --retry-delay 2 -o "$A/$1" "$2"; }
          d toposcope_sunset_2k.exr https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/toposcope_sunset_2k.exr
          d qwantani_dusk_2_puresky_2k.exr https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/qwantani_dusk_2_puresky_2k.exr
          d synthetic_wood_diff_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_diff_1k.jpg
          d synthetic_wood_nor_gl_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_nor_gl_1k.jpg
          d synthetic_wood_rough_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_rough_1k.jpg
          d beige_wall_001_diff_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_diff_1k.jpg
          d beige_wall_001_nor_gl_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_nor_gl_1k.jpg
          d beige_wall_001_rough_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_rough_1k.jpg
          d marble_01_diff_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_diff_2k.jpg
          d marble_01_nor_gl_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_nor_gl_2k.jpg
          d marble_01_rough_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_rough_2k.jpg

      - name: Generate Pool Context v4 guided-hero asset
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' \
            blender --background --python projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v04_pool_context_v4.py

      - name: Validate context, frozen route and guided camera separation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct

          root = Path('projects/Dubai-Luxury-Villa-AI')
          png = root / 'renders/villa-v0.4-pool-context-v4.png'
          glb = root / 'exports/villa-v0.4-pool-context-v4.glb'
          blend = root / 'exports/villa-v0.4-pool-context-v4.blend'
          for path in (png, glb, blend):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing Pool Context v4 output: {path}')

          raw_png = png.read_bytes()
          width, height = struct.unpack('>II', raw_png[16:24])
          if (width, height) != (1600, 900):
              raise SystemExit(f'unexpected render size: {width}x{height}')

          raw = glb.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', raw, 0)
          if magic != b'glTF' or version != 2 or length != len(raw):
              raise SystemExit('invalid Pool Context v4 GLB')
          json_length, json_type = struct.unpack_from('<II', raw, 12)
          if json_type != 0x4E4F534A:
              raise SystemExit('first GLB chunk is not JSON')
          doc = json.loads(raw[20:20 + json_length].decode('utf-8').rstrip('\x00 '))
          nodes = {node.get('name') for node in doc.get('nodes', []) if node.get('name')}

          required = {
              'tour_pool', 'tour_present_pool', 'tour_present_look_pool', 'infinity_lip',
              'pool_context_ground_v3', 'pool_context_planter_edge_v3',
              'pool_context_agaves_v3', 'pool_context_grasses_v3',
              'tour_stair_upper', 'master_door_open_v04_r4'
          }
          missing = sorted(required - nodes)
          if missing:
              raise SystemExit(f'missing Pool Context v4 nodes: {missing}')
          if 'upper_stone_spine' in nodes or 'master_door_v04' in nodes:
              raise SystemExit('stable Interior3 repair regressed')

          used = set(doc.get('extensionsUsed') or [])
          if 'KHR_lights_punctual' in used:
              raise SystemExit('punctual lights leaked into web GLB')

          report = {
              'version': 'v0.4-pool-context-v4',
              'status': 'RENDERED_NOT_YET_PROMOTED',
              'route_boundary': 'tour_pool remains Explore authority; tour_present_pool is Guided-only',
              'presentation_nodes': ['tour_present_pool', 'tour_present_look_pool'],
              'render': {
                  'file': str(png), 'width': width, 'height': height,
                  'bytes': len(raw_png), 'sha256': hashlib.sha256(raw_png).hexdigest()
              },
              'glb': {
                  'file': str(glb), 'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest()
              },
              'blend': {
                  'file': str(blend), 'bytes': blend.stat().st_size,
                  'sha256': hashlib.sha256(blend.read_bytes()).hexdigest()
              },
              'claim_boundary': 'Portfolio visualization only; not BIM/construction/landscape documentation.'
          }
          receipt = root / 'validation/v0.4-pool-context-v4-receipt.json'
          receipt.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload Pool Context v4 review packet
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-v0.4-pool-context-v4-gate
          path: |
            projects/Dubai-Luxury-Villa-AI/renders/villa-v0.4-pool-context-v4.png
            projects/Dubai-Luxury-Villa-AI/exports/villa-v0.4-pool-context-v4.glb
            projects/Dubai-Luxury-Villa-AI/exports/villa-v0.4-pool-context-v4.blend
            projects/Dubai-Luxury-Villa-AI/validation/v0.4-pool-context-v4-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Promote verified asset to integration branch
        env:
          TARGET_BRANCH: feat/pool-context-v4
        run: |
          set -euxo pipefail
          ROOT='projects/Dubai-Luxury-Villa-AI'
          STAGE=/tmp/pool-v4-promotion
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "$ROOT/exports/villa-v0.4-pool-context-v4.glb" "$STAGE/villa.glb"
          cp "$ROOT/renders/villa-v0.4-pool-context-v4.png" "$STAGE/villa-v0.4-pool-context-v4.png"
          cp "$ROOT/validation/v0.4-pool-context-v4-receipt.json" "$STAGE/v0.4-pool-context-v4-receipt.json"
          cp "$ROOT/blender/scripts/run_v04_pool_context.py" "$STAGE/run_v04_pool_context.py"
          cp "$ROOT/blender/scripts/run_v04_pool_context_v4.py" "$STAGE/run_v04_pool_context_v4.py"

          export GLB_SHA="$(sha256sum "$STAGE/villa.glb" | awk '{print $1}')"
          export GLB_BYTES="$(stat -c%s "$STAGE/villa.glb")"
          export SOURCE_RUN_ID="$GITHUB_RUN_ID"

          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          mkdir -p "$ROOT/web-viewer/app/public" "$ROOT/validation" "$ROOT/renders" "$ROOT/blender/scripts"
          cp "$STAGE/villa.glb" "$ROOT/web-viewer/app/public/villa.glb"
          cp "$STAGE/villa-v0.4-pool-context-v4.png" "$ROOT/renders/villa-v0.4-pool-context-v4.png"
          cp "$STAGE/v0.4-pool-context-v4-receipt.json" "$ROOT/validation/v0.4-pool-context-v4-receipt.json"
          cp "$STAGE/run_v04_pool_context.py" "$ROOT/blender/scripts/run_v04_pool_context.py"
          cp "$STAGE/run_v04_pool_context_v4.py" "$ROOT/blender/scripts/run_v04_pool_context_v4.py"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('projects/Dubai-Luxury-Villa-AI')
          digest = os.environ['GLB_SHA']
          size = int(os.environ['GLB_BYTES'])
          run_id = int(os.environ['SOURCE_RUN_ID'])

          manifest = {
              'asset': 'Dubai Luxury Villa AI',
              'viewer_asset': 'villa.glb',
              'version': 'v0.4-pool-context-v4-feature-candidate',
              'status': 'FEATURE_BRANCH_VISUAL_QA_ONLY',
              'source_pipeline': {
                  'form': 'v0.3-r1.2 PASS / FROZEN',
                  'material': 'v0.3-m4 PASS / FROZEN',
                  'light': 'v0.3-l2 PASS / FROZEN',
                  'life': 'v0.3-life2 PASS / FROZEN',
                  'interior': 'v0.4-interior3 root-cause repair preserved',
                  'pool_context': 'v0.4 Pool Context v4 authored desert garden + guided hero camera',
                  'web_light_boundary': 'Three.js owns runtime lighting; Blender punctual lights stripped from GLB'
              },
              'glb': {'bytes': size, 'sha256': digest, 'version': 2},
              'room_anchors': ['living_room', 'master_bedroom', 'pool_terrace'],
              'tour_anchors': [
                  'tour_graph_root', 'tour_entry', 'tour_living', 'tour_dining',
                  'tour_stair_ground', 'tour_stair_upper', 'tour_master', 'tour_pool'
              ],
              'tour_look_targets': [
                  'tour_look_entry', 'tour_look_living', 'tour_look_dining',
                  'tour_look_stair_ground', 'tour_look_stair_upper',
                  'tour_look_master', 'tour_look_pool'
              ],
              'presentation_nodes': ['tour_present_pool', 'tour_present_look_pool'],
              'navigation_boundary': 'GUIDED_PRESENTATION_SEPARATE_FROM_EXPLORE_ROUTE',
              'features': [
                  'persistent single-load Three.js scene',
                  'explicit Guided and Explore modes',
                  'bounded first-person route',
                  'clear Upper Landing and open master-suite threshold',
                  'family-specific material response',
                  'authored desert planting beyond infinity edge',
                  'independent Pool Guided hero camera without moving tour_pool',
                  'browser-owned Day Evening Night lighting without duplicated Blender punctual lights'
              ],
              'generator': 'Native Blender 4.0.2 pipeline via GitHub Actions',
              'promotion_scope': 'feat/pool-context-v4 only; main intentionally untouched',
              'claim_boundary': 'AI-assisted architectural visualization and virtual-tour prototype; not BIM, measured construction geometry, code-compliance evidence, landscape construction documentation or as-built documentation.'
          }
          (root / 'web-viewer/app/public/villa.asset.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )

          promotion = {
              'version': 'v0.4-pool-context-v4-feature-promotion',
              'source_workflow_run': run_id,
              'viewer_asset': 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/public/villa.glb',
              'bytes': size,
              'sha256': digest,
              'scope': 'FEATURE_BRANCH_ONLY',
              'lighting_boundary': 'BLENDER_PUNCTUAL_LIGHTS_STRIPPED_BROWSER_OWNS_RUNTIME_LIGHTING',
              'navigation_boundary': 'GUIDED_PRESENTATION_SEPARATE_FROM_EXPLORE_ROUTE',
              'visual_review': 'POOL_V4_GUIDED_HERO_PASS',
              'next_gate': 'Viewer Build + First Person Tour QA + Pool Terrace Bead Gate + Full Walkthrough Visual Gate',
              'main_untouched': True
          }
          (root / 'validation/v0.4-pool-context-v4-feature-promotion.json').write_text(
              json.dumps(promotion, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$ROOT/web-viewer/app/public/villa.glb" \
            "$ROOT/web-viewer/app/public/villa.asset.json" \
            "$ROOT/validation/v0.4-pool-context-v4-feature-promotion.json" \
            "$ROOT/validation/v0.4-pool-context-v4-receipt.json" \
            "$ROOT/renders/villa-v0.4-pool-context-v4.png" \
            "$ROOT/blender/scripts/run_v04_pool_context.py" \
            "$ROOT/blender/scripts/run_v04_pool_context_v4.py"
          git commit -m 'Promote Pool Context v4 feature asset'
          git push origin HEAD:"$TARGET_BRANCH"
