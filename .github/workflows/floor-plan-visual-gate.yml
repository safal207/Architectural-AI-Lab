name: Floor Plan Visual Gate

on:
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/TourExperience.jsx'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/TourExperience.css'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/src/tourData.js'
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa/floor-plan-visual-gate.mjs'
      - '.github/workflows/floor-plan-visual-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-plan-gate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build viewer
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-plan-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/villa-plan-preview.log
          exit 1

      - name: Capture Floor 2 plan and Upper Landing gate
        env:
          VILLA_URL: http://127.0.0.1:4173/
          QA_OUTPUT: qa-floor-plan-output
        run: node qa/floor-plan-visual-gate.mjs

      - name: Upload dream-loop gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-floor-plan-visual-gate
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-floor-plan-output
          if-no-files-found: warn
          retention-days: 14
