name: Render Investigation (manual)
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Measurement to reproduce (diagnostic, not a release gate)
        required: true
        default: completed-work
        type: choice
        options: [completed-work, cold, candidates]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app
    env:
      VILLA_URL: http://127.0.0.1:4173/
      QA_OUTPUT: qa-render-investigation-output
      EXPERIMENT: ${{ inputs.experiment }}
      PR_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Build diagnostic copy; verify product sources were restored
        run: |
          case "$EXPERIMENT" in
            completed-work|candidates) node qa/render-profile.mjs --build ;;
            cold) node qa/render-cold-profile.mjs --build ;;
            *) echo "Unknown experiment"; exit 1 ;;
          esac
          git diff --exit-code -- src public package.json package-lock.json
      - name: Install pinned browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve diagnostic build
        run: |
          DIR=dist-render-profile
          if [ "$EXPERIMENT" = cold ]; then DIR=dist-cold-profile; fi
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$DIR" > /tmp/render-investigation.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "$VILLA_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/render-investigation.log
          exit 1
      - name: Run selected measurement
        run: |
          case "$EXPERIMENT" in
            completed-work) node qa/render-profile.mjs ;;
            cold) node qa/render-cold-profile.mjs ;;
            candidates) node qa/render-candidate.mjs ;;
          esac
      - name: Upload measurements even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-investigation-${{ inputs.experiment }}
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-render-investigation-output
          if-no-files-found: warn
          retention-days: 14
