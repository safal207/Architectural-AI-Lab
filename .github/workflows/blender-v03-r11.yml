name: Blender v0.3 r1.1 Clay Review

on:
  push:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v03_r11.py'
      - 'projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v03_r1.py'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.3-r1-visual-critique.md'
      - '.github/workflows/blender-v03-r11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dubai-villa-v03-r11-clay
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and software rendering stack
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          blender --version | head -n 1

      - name: Fetch CC0 Poly Haven assets used by inherited scene
        run: |
          set -euxo pipefail
          A='projects/Dubai-Luxury-Villa-AI/assets/third-party/polyhaven'
          mkdir -p "$A"
          d(){ curl -L --fail --retry 3 --retry-delay 2 -o "$A/$1" "$2"; }
          d toposcope_sunset_2k.exr https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/toposcope_sunset_2k.exr
          d qwantani_dusk_2_puresky_2k.exr https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/2k/qwantani_dusk_2_puresky_2k.exr
          d synthetic_wood_diff_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_diff_1k.jpg
          d synthetic_wood_nor_gl_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_nor_gl_1k.jpg
          d synthetic_wood_rough_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/synthetic_wood/synthetic_wood_rough_1k.jpg
          d beige_wall_001_diff_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_diff_1k.jpg
          d beige_wall_001_nor_gl_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_nor_gl_1k.jpg
          d beige_wall_001_rough_1k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/beige_wall_001/beige_wall_001_rough_1k.jpg
          d marble_01_diff_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_diff_2k.jpg
          d marble_01_nor_gl_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_nor_gl_2k.jpg
          d marble_01_rough_2k.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/marble_01/marble_01_rough_2k.jpg

      - name: Generate v0.3 r1.1 architectural clay review
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' \
            blender --background --python projects/Dubai-Luxury-Villa-AI/blender/scripts/run_v03_r11.py

      - name: Validate A/B outputs and write receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import struct

          root = Path('projects/Dubai-Luxury-Villa-AI')
          baseline = root / 'renders/villa-v0.3-r1-clay.png'
          candidate = root / 'renders/villa-v0.3-r1.1-clay.png'
          glb = root / 'exports/villa-v0.3-r1.1-massing.glb'
          blend = root / 'exports/villa-v0.3-r1.1.blend'

          for path in (baseline, candidate, glb, blend):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing output: {path}')

          def png_meta(path):
              raw = path.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'invalid PNG signature: {path}')
              width, height = struct.unpack('>II', raw[16:24])
              return raw, width, height

          base_raw, base_w, base_h = png_meta(baseline)
          cand_raw, cand_w, cand_h = png_meta(candidate)
          if (base_w, base_h) != (1600, 900) or (cand_w, cand_h) != (1600, 900):
              raise SystemExit('A/B render dimensions must both be 1600x900')

          raw_glb = glb.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', raw_glb, 0)
          if magic != b'glTF' or version != 2 or length != len(raw_glb):
              raise SystemExit('invalid GLB container')

          report = {
              'version': 'v0.3-r1.1',
              'stage': 'FORM',
              'quality_status': 'CLAY_AB_REVIEW_NOT_YET_VISUALLY_APPROVED',
              'camera_contract': 'identical to v0.3-r1: location=(24.8,28.6,1.72), lens=40mm, shift_y=0.075',
              'baseline': {
                  'file': str(baseline),
                  'width': base_w,
                  'height': base_h,
                  'bytes': len(base_raw),
                  'sha256': hashlib.sha256(base_raw).hexdigest(),
              },
              'candidate': {
                  'file': str(candidate),
                  'width': cand_w,
                  'height': cand_h,
                  'bytes': len(cand_raw),
                  'sha256': hashlib.sha256(cand_raw).hexdigest(),
              },
              'glb': {
                  'file': str(glb),
                  'version': version,
                  'bytes': len(raw_glb),
                  'sha256': hashlib.sha256(raw_glb).hexdigest(),
                  'container_length_matches': True,
              },
              'blend': {
                  'file': str(blend),
                  'bytes': blend.stat().st_size,
                  'sha256': hashlib.sha256(blend.read_bytes()).hexdigest(),
              },
              'targets': [
                  'trim and thin roof hierarchy',
                  'reduce blank left ground core',
                  'recess upper glazing behind thinner frame',
                  'thin foreground plinth layers',
                  'simplify pool/terrace edge stacking'
              ],
              'claim_boundary': 'Architectural visualization prototype; not BIM or construction documentation.'
          }

          receipt = root / 'validation/v0.3-r1.1-clay-receipt.json'
          receipt.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload v0.3 r1.1 A/B review packet
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-v0.3-r1.1-clay-ab-review
          path: |
            projects/Dubai-Luxury-Villa-AI/renders/villa-v0.3-r1-clay.png
            projects/Dubai-Luxury-Villa-AI/renders/villa-v0.3-r1.1-clay.png
            projects/Dubai-Luxury-Villa-AI/exports/villa-v0.3-r1.1-massing.glb
            projects/Dubai-Luxury-Villa-AI/exports/villa-v0.3-r1.1.blend
            projects/Dubai-Luxury-Villa-AI/validation/v0.3-r1.1-clay-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish r1.1 clay review evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/Dubai-Luxury-Villa-AI/renders/villa-v0.3-r1.1-clay.png \
            projects/Dubai-Luxury-Villa-AI/validation/v0.3-r1.1-clay-receipt.json
          if git diff --cached --quiet; then
            echo 'r1.1 clay review evidence unchanged'
            exit 0
          fi
          git commit -m 'Publish Dubai villa v0.3 r1.1 clay review'
          git pull --rebase origin main
          git push origin HEAD:main
