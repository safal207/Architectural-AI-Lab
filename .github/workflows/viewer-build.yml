name: Viewer Build

on:
  push:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - 'projects/Dubai-Luxury-Villa-AI/tools/**'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.3-viewer-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-viewer-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-*-feature-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-pool-context-v4-receipt.json'
      - 'projects/Dubai-Luxury-Villa-AI/renders/villa-v0.4-pool-context-v4.png'
      - '.github/workflows/viewer-build.yml'
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - 'projects/Dubai-Luxury-Villa-AI/tools/**'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.3-viewer-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-viewer-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-*-feature-promotion.json'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.4-pool-context-v4-receipt.json'
      - 'projects/Dubai-Luxury-Villa-AI/renders/villa-v0.4-pool-context-v4.png'
      - '.github/workflows/viewer-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install image validation dependency
        run: python -m pip install -r ../../tools/requirements-validation.txt

      - name: Run asset validation regressions
        run: python -m unittest discover -s ../../tools -p 'test_validate_viewer_asset.py'

      - name: Validate current gated GLB and provenance
        run: python ../../tools/validate_viewer_asset.py

      - name: Build viewer
        run: npm run build

      - name: Verify rain surfaces and residence interactions
        run: |
          node qa/rain-surfaces.mjs
          node qa/residence-interactions.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke test built viewer, GLB delivery and estate interactions
        env:
          VILLA_URL: http://127.0.0.1:4173/
          QA_OUTPUT: qa-estate-output
        run: |
          mkdir -p "$QA_OUTPUT"
          # Own the Vite PID directly so cleanup also waits for the server.
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > "$QA_OUTPUT/preview.log" 2>&1 &
          PID=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for i in {1..60}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$QA_OUTPUT/preview.log"
              exit 1
            fi
            if curl -fsS --max-time 2 "$VILLA_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          kill -0 "$PID"
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/viewer-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/villa.asset.json > /tmp/viewer-villa.asset.json
          curl --fail --silent --show-error http://127.0.0.1:4173/villa.glb > /tmp/viewer-villa.glb
          test -s /tmp/viewer-index.html
          test -s /tmp/viewer-villa.asset.json
          test -s /tmp/viewer-villa.glb
          cmp public/villa.asset.json /tmp/viewer-villa.asset.json
          cmp public/villa.glb /tmp/viewer-villa.glb
          echo 'Viewer HTML, provenance manifest and exact gated GLB served successfully'
          node qa/living-estate.mjs

      - name: Upload estate browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-estate-qa
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/qa-estate-output
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified viewer build
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-viewer-dist
          path: |
            projects/Dubai-Luxury-Villa-AI/web-viewer/app/dist
            projects/Dubai-Luxury-Villa-AI/web-viewer/app/public/villa.asset.json
          if-no-files-found: error
          retention-days: 14
