name: Viewer Build

on:
  push:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - 'projects/Dubai-Luxury-Villa-AI/tools/**'
      - 'projects/Dubai-Luxury-Villa-AI/exports/villa-v0.2-hero.glb'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.2-hero-render-receipt.json'
      - '.github/workflows/viewer-build.yml'
  pull_request:
    paths:
      - 'projects/Dubai-Luxury-Villa-AI/web-viewer/app/**'
      - 'projects/Dubai-Luxury-Villa-AI/tools/**'
      - 'projects/Dubai-Luxury-Villa-AI/exports/villa-v0.2-hero.glb'
      - 'projects/Dubai-Luxury-Villa-AI/validation/v0.2-hero-render-receipt.json'
      - '.github/workflows/viewer-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Dubai-Luxury-Villa-AI/web-viewer/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Stage validated v0.2 hero GLB
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          source = Path('../../exports/villa-v0.2-hero.glb')
          receipt_path = Path('../../validation/v0.2-hero-render-receipt.json')
          target = Path('public/villa.glb')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          raw = source.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected = receipt['glb']

          assert len(raw) == expected['bytes'], (len(raw), expected['bytes'])
          assert digest == expected['sha256'], (digest, expected['sha256'])
          shutil.copyfile(source, target)
          print(f"staged {receipt['version']}: {len(raw)} bytes sha256={digest}")
          PY

      - name: Validate staged Blender GLB asset
        run: |
          test -s public/villa.glb
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('public/villa.glb')
          raw = p.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', raw, 0)
          assert magic == b'glTF', magic
          assert version == 2, version
          assert length == len(raw), (length, len(raw))
          print(f'villa.glb OK: {len(raw)} bytes, GLB v{version}')
          PY

      - name: Build viewer
        run: npm run build

      - name: Smoke test built viewer and GLB delivery
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/villa-viewer-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/viewer-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/villa.glb > /tmp/viewer-villa.glb
          test -s /tmp/viewer-index.html
          test -s /tmp/viewer-villa.glb
          cmp public/villa.glb /tmp/viewer-villa.glb
          echo "Viewer HTML and validated v0.2 Blender GLB served successfully"

      - name: Upload verified viewer build
        uses: actions/upload-artifact@v4
        with:
          name: dubai-villa-viewer-dist
          path: projects/Dubai-Luxury-Villa-AI/web-viewer/app/dist
          if-no-files-found: error
          retention-days: 14
